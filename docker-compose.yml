services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outside}
      POSTGRES_USER: ${POSTGRES_USER:-outside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outside}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `web` gates on this; without it the app races Postgres on startup.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outside} -d ${POSTGRES_DB:-outside}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    env_file:
      - .env
    environment:
      # Point at the compose service regardless of what .env says.
      DATABASE_URL: postgres://${POSTGRES_USER:-outside}:${POSTGRES_PASSWORD:-outside}@db:5432/${POSTGRES_DB:-outside}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
